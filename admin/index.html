<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV.SRHJ — Menghubungkan ke Server Kantor...</title>
<link rel="icon" href="../assets/favicon.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0f0c;color:#f3f4ef;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:20px}
  .box{max-width:360px;padding:24px;border:1px solid #262922;border-radius:14px;background:#151712}
  .dot{width:10px;height:10px;border-radius:50%;background:#f5b301;display:inline-block;margin-right:8px;animation:p 1s infinite alternate}
  @keyframes p{from{opacity:.3}to{opacity:1}}
  p{color:#9aa08d;font-size:14px;margin:8px 0 0;line-height:1.5}
  a{color:#f5b301;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div><i class="dot"></i><b>CV.SRHJ Admin</b></div>
  <p id="msg">Menghubungkan ke server PC kantor...</p>
</div>
<script>
(async()=>{
  try{
    let u="";
    const r=await fetch("https://api.github.com/repos/Bintangmuda-new/srirejekihorn/contents/tunnel.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      const d=JSON.parse(atob(j.content.replace(/\s/g,"")));
      u=d.url;
    }else{
      const r2=await fetch("../tunnel.json?t="+Date.now(),{cache:"no-store"});
      const d2=await r2.json();
      u=d2.url;
    }
    if(u){location.replace(u.replace(/\/$/,"")+"/admin");}
    else{document.getElementById("msg").textContent="Server kantor sedang offline.";}
  }catch(e){
    document.getElementById("msg").textContent="Gagal menghubungi server kantor. Pastikan PC kantor menyala.";
  }
})();
</script>
</body>
</html>
